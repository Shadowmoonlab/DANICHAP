<!DOCTYPE html>
<html lang="es" class="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ingresar — DANICHAP</title>
<!-- Security -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://stambpkmtwtnhfjmxztl.supabase.co https://*.supabase.co; connect-src 'self' https://stambpkmtwtnhfjmxztl.supabase.co https://*.supabase.co wss://stambpkmtwtnhfjmxztl.supabase.co; base-uri 'self'; form-action 'self';"/>
<meta http-equiv="X-Content-Type-Options" content="nosniff"/>
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin"/>
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()"/>
<meta name="robots" content="noindex, nofollow"/>
<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="docs/img/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="docs/img/favicon-16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="docs/img/favicon-180.png"/>
<link rel="icon" type="image/svg+xml" href="docs/img/danichap-icon.svg"/>
<meta name="theme-color" content="#001e4b"/>
<link rel="preconnect" href="https://stambpkmtwtnhfjmxztl.supabase.co"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css?v=7"/>
<link rel="stylesheet" href="tailwind.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="toast.js?v=3"></script>
<script src="supabase.js?v=2"></script>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-sm">
  <!-- Logo -->
  <a href="index.html" class="flex items-center justify-center gap-3 mb-10 group">
    <img src="docs/img/danichaplogo-transparent.png" alt="DANICHAP" width="36" height="36" class="amber-glow-sm rounded-sm object-contain logo-36"/>
    <div class="leading-none">
      <span class="block font-headline font-black text-xl uppercase tracking-tight text-on-surface">DANICHAP</span>
      <span class="block text-[9px] font-bold tracking-[0.2em] uppercase font-label text-primary-container">REPUESTOS · LONGCHAMPS</span>
    </div>
  </a>

  <!-- Card -->
  <div class="bg-surface border border-outline-variant rounded-2xl shadow-sm p-8">
    <!-- Tabs -->
    <div class="flex gap-1 mb-7 bg-surface-container rounded-xl p-1">
      <button id="tab-login"    class="flex-1 py-2 rounded-lg text-sm font-bold font-headline uppercase tracking-wide transition-all bg-surface shadow text-on-surface">Ingresar</button>
      <button id="tab-register" class="flex-1 py-2 rounded-lg text-sm font-bold font-headline uppercase tracking-wide transition-all text-secondary">Registrarse</button>
    </div>

    <!-- Login form -->
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Email</label>
        <input type="email" name="email" required autofocus autocomplete="email"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Contraseña</label>
        <input type="password" name="password" required autocomplete="current-password"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
        <p class="text-right mt-1">
          <button type="button" id="btn-olvide" class="text-primary-container text-xs font-bold font-body hover:underline">¿Olvidaste tu contraseña?</button>
        </p>
      </div>
      <p id="login-error" class="text-error text-xs hidden font-body"></p>
      <p id="login-info" class="text-tertiary text-xs hidden font-body"></p>
      <button type="submit"
        class="w-full bg-primary-container text-white py-3 rounded-xl font-bold font-headline uppercase text-sm hover:opacity-90 transition-opacity">
        Entrar
      </button>
    </form>

    <!-- Register form -->
    <form id="form-register" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Nombre</label>
        <input type="text" name="nombre" required autocomplete="name"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Email</label>
        <input type="email" name="email" required autocomplete="email"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Contraseña</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
      </div>
      <p id="register-error"   class="text-error   text-xs hidden font-body"></p>
      <p id="register-success" class="text-tertiary text-xs hidden font-body">¡Cuenta creada! Revisá tu email para confirmar.</p>
      <button type="submit"
        class="w-full bg-primary-container text-white py-3 rounded-xl font-bold font-headline uppercase text-sm hover:opacity-90 transition-opacity">
        Crear cuenta
      </button>
    </form>

    <!-- Nueva contraseña (al abrir el link del mail de recuperación) -->
    <form id="form-nueva" class="space-y-4 hidden">
      <p class="text-sm font-body text-on-surface">Elegí tu contraseña nueva.</p>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Contraseña nueva</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
      </div>
      <div>
        <label class="block text-xs font-bold uppercase tracking-wide text-secondary mb-1.5">Repetila</label>
        <input type="password" name="password2" required minlength="6" autocomplete="new-password"
          class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-primary-container transition-colors"/>
      </div>
      <p id="nueva-error" class="text-error text-xs hidden font-body"></p>
      <button type="submit"
        class="w-full bg-primary-container text-white py-3 rounded-xl font-bold font-headline uppercase text-sm hover:opacity-90 transition-opacity">
        Guardar contraseña
      </button>
    </form>
  </div>

  <p class="text-center text-secondary text-xs font-body mt-6">
    <a href="index.html" class="hover:text-on-surface transition-colors">← Volver al sitio</a>
  </p>
</div>

<script>
  // Se lee antes que nada: sesionDeRecuperacion() borra el token de la barra apenas lo toma
  const LINK_RECUPERACION = /type=recovery/.test(location.hash);

  // ── Olvidé mi contraseña: manda el mail con el link ──
  const mostrar = (id, texto) => { const el = document.getElementById(id); el.textContent = texto; el.classList.toggle('hidden', !texto); };
  document.getElementById('btn-olvide').addEventListener('click', async e => {
    const btn = e.currentTarget;
    const email = (document.querySelector('#form-login [name=email]').value || '').trim();
    mostrar('login-error', ''); mostrar('login-info', '');
    if (!/^\S+@\S+\.\S+$/.test(email)) { mostrar('login-error', 'Escribí tu email arriba y volvé a tocar "¿Olvidaste tu contraseña?".'); return; }
    btn.disabled = true;
    const { error } = await Auth.recuperarClave(email);
    btn.disabled = false;
    // Mismo mensaje exista o no la cuenta: no se revela qué emails están registrados
    if (error && !/rate|limit|seconds/i.test(error.message)) mostrar('login-error', 'No se pudo enviar el mail. Probá en unos minutos.');
    else if (error) mostrar('login-error', 'Ya te mandamos un mail hace poco. Esperá un minuto y revisá también la carpeta de spam.');
    else mostrar('login-info', `Si ${email} tiene cuenta, te llega un mail con un link para crear una contraseña nueva. Revisá también la carpeta de spam.`);
  });

  // ── Link del mail de recuperación: pedir la contraseña nueva ──
  (async () => {
    // Link vencido, ya usado o inválido: Supabase vuelve con #error=…&error_code=otp_expired (o el token no sirve)
    const linkConError = /error_code=|error=/.test(location.hash);
    if (!(await Auth.sesionDeRecuperacion())) {
      if (linkConError || LINK_RECUPERACION) {
        history.replaceState(null, '', location.pathname);
        mostrar('login-error', 'El link para cambiar la contraseña venció o ya se usó. Escribí tu email y tocá "¿Olvidaste tu contraseña?" para pedir otro.');
      }
      return;
    }
    document.getElementById('form-login').classList.add('hidden');
    document.getElementById('form-register').classList.add('hidden');
    document.getElementById('tab-login').parentElement.classList.add('hidden');
    document.getElementById('form-nueva').classList.remove('hidden');
  })();
  document.getElementById('form-nueva').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const pass = fd.get('password') || '', pass2 = fd.get('password2') || '';
    if (pass.length < 6) { mostrar('nueva-error', 'La contraseña tiene que tener al menos 6 caracteres.'); return; }
    if (pass !== pass2) { mostrar('nueva-error', 'Las dos contraseñas no coinciden.'); return; }
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Guardando…';
    const { error } = await Auth.cambiarClave(pass);
    if (error) { btn.disabled = false; btn.textContent = 'Guardar contraseña'; mostrar('nueva-error', 'No se pudo guardar. Pedí otro mail de recuperación y probá de nuevo.'); return; }
    window.showToast?.('Contraseña actualizada', 'success');
    const user = await Auth.getUser();
    const perfil = user ? await Perfiles.get(user.id).catch(() => null) : null;
    window.location.href = perfil?.rol === 'admin' ? 'admin.html' : 'index.html';
  });

  // Tab switching
  document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
  document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('form-login').classList.toggle('hidden', !isLogin);
    document.getElementById('form-register').classList.toggle('hidden', isLogin);
    const base = 'flex-1 py-2 rounded-lg text-sm font-bold font-headline uppercase tracking-wide transition-all';
    document.getElementById('tab-login').className    = `${base} ${isLogin  ? 'bg-surface shadow text-on-surface' : 'text-secondary'}`;
    document.getElementById('tab-register').className = `${base} ${!isLogin ? 'bg-surface shadow text-on-surface' : 'text-secondary'}`;
  }

  // Login
  document.getElementById('form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const fd    = new FormData(e.target);
    const email = (fd.get('email') || '').trim();
    const pass  = fd.get('password') || '';
    const errEl = document.getElementById('login-error');
    const btn   = e.target.querySelector('button[type=submit]');

    errEl.classList.add('hidden');
    errEl.textContent = '';

    if (!email || !pass) {
      errEl.textContent = 'Completá email y contraseña.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.textContent = 'Entrando…'; btn.disabled = true;
    const resetBtn = () => { btn.textContent = 'Entrar'; btn.disabled = false; };

    let data, error;
    try {
      const timeoutP = new Promise((_, rej) =>
        setTimeout(() => rej(new Error('timeout')), 15000)
      );
      ({ data, error } = await Promise.race([
        Auth.signIn(email, pass),
        timeoutP,
      ]));
    } catch (ex) {
      error = ex;
    }

    if (error) {
      resetBtn();
      const msg = (error.message || '').toLowerCase();
      if (msg === 'timeout') {
        errEl.textContent = 'La conexión tardó demasiado. Revisá tu internet e intentá de nuevo.';
      } else if (msg.includes('invalid') || msg.includes('credentials') || msg.includes('not found')) {
        errEl.textContent = 'Email o contraseña incorrectos. Verificá tus datos.';
      } else if (msg.includes('email not confirmed')) {
        errEl.textContent = 'Confirmá tu email antes de ingresar. Revisá tu casilla de correo.';
      } else if (msg.includes('network') || msg.includes('fetch') || msg.includes('failed')) {
        errEl.textContent = 'Sin conexión. Revisá tu internet e intentá de nuevo.';
      } else {
        errEl.textContent = 'No se pudo iniciar sesión. Intentá más tarde.';
      }
      errEl.classList.remove('hidden');
      return;
    }

    // Email sin confirmar: Supabase devuelve error:null pero user:null
    if (!data?.user?.id) {
      resetBtn();
      errEl.textContent = 'Confirmá tu email antes de ingresar. Revisá tu casilla de correo.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.textContent = 'Redirigiendo…';
    try {
      const perfil = await Perfiles.get(data.user.id);
      window.location.href = perfil?.rol === 'admin' ? 'admin.html' : 'index.html';
    } catch (_) {
      window.location.href = 'index.html';
    }
  });

  // Register
  document.getElementById('form-register').addEventListener('submit', async e => {
    e.preventDefault();
    const fd    = new FormData(e.target);
    const errEl = document.getElementById('register-error');
    const okEl  = document.getElementById('register-success');
    const btn   = e.target.querySelector('button[type=submit]');
    errEl.classList.add('hidden'); okEl.classList.add('hidden');
    btn.textContent = 'Creando…'; btn.disabled = true;
    let error;
    try {
      ({ error } = await Auth.signUp(fd.get('email'), fd.get('password'), fd.get('nombre')));
    } catch (ex) {
      error = ex;
    }
    btn.textContent = 'Crear cuenta'; btn.disabled = false;
    if (error) {
      errEl.textContent = error.message || 'No se pudo crear la cuenta. Intentá más tarde.';
      errEl.classList.remove('hidden');
      return;
    }
    okEl.classList.remove('hidden');
    e.target.reset();
  });

  // Si ya está logueado, redirigir (usa getSession — lectura local, sin roundtrip)
  Auth.getUser().then(async user => {
    if (!user || LINK_RECUPERACION) return;   // con el link del mail primero se elige la contraseña nueva
    try {
      const perfil = await Perfiles.get(user.id);
      window.location.href = perfil?.rol === 'admin' ? 'admin.html' : 'index.html';
    } catch (_) {
      window.location.href = 'index.html';
    }
  }).catch(() => {});
</script>
</body>
</html>
