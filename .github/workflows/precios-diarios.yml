name: Precios diarios de distribuidores

# Corre solo todos los días en servidores de GitHub (gratis en repos públicos). No usa IA.
# Qué distribuidores corren lo decide scrapers/distribuidores.mjs (activo: true): sumar uno no requiere tocar este archivo.
on:
  schedule:
    - cron: '0 9 * * *'    # 06:00 hora Argentina (UTC-3): todos. GitHub puede atrasarlo unos minutos.
    - cron: '0 15 * * *'   # 12:00: reintento solo de los que fallaron (sitio caído, etc.)
    - cron: '0 21 * * *'   # 18:00: último reintento del día
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano

concurrency:
  group: precios-diarios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.plan.outputs.lista }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: node scrapers/plan.mjs
        env:
          SOLO_PENDIENTES: ${{ github.event_name == 'schedule' && github.event.schedule != '0 9 * * *' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  scrape:
    needs: plan
    if: needs.plan.outputs.lista != '[]'
    name: ${{ matrix.d.slug }}
    runs-on: ubuntu-latest   # Plan B si un sitio bloquea IPs de fuera de Argentina: runs-on: self-hosted (PC del local)
    timeout-minutes: 20   # cada robot tarda 1-2 min; si uno se cuelga no frena a los demás ni al reintento
    strategy:
      fail-fast: false     # si un distribuidor falla, los demás siguen
      matrix:
        d: ${{ fromJSON(needs.plan.outputs.lista) }}
    steps:
      - uses: actions/checkout@v5

      # Sin npm install: los robots solo usan Node y la planilla de vendor/ (arranca en segundos)
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Robot ${{ matrix.d.slug }}
        run: node scrapers/${{ matrix.d.archivo }}.mjs
        # Cada secret por nombre (pasarlos todos juntos GitHub lo marca como posible robo de claves).
        # Distribuidor nuevo con login = sumar acá sus dos líneas.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DM_EMAIL: ${{ secrets.DM_EMAIL }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
          DM_COOKIE_ID: ${{ secrets.DM_COOKIE_ID }}
          PR_USER: ${{ secrets.PR_USER }}
          PR_PASSWORD: ${{ secrets.PR_PASSWORD }}
          GOICOECHEA_USER: ${{ secrets.GOICOECHEA_USER }}
          GOICOECHEA_PASSWORD: ${{ secrets.GOICOECHEA_PASSWORD }}
          DISTRISUPER_USER: ${{ secrets.DISTRISUPER_USER }}
          DISTRISUPER_PASSWORD: ${{ secrets.DISTRISUPER_PASSWORD }}
          OTERO_USER: ${{ secrets.OTERO_USER }}
          OTERO_PASSWORD: ${{ secrets.OTERO_PASSWORD }}
          FAL_USER: ${{ secrets.FAL_USER }}
          FAL_PASSWORD: ${{ secrets.FAL_PASSWORD }}
          FAL_LISTA_URL: ${{ secrets.FAL_LISTA_URL }}
          DELVISO_USER: ${{ secrets.DELVISO_USER }}
          DELVISO_PASSWORD: ${{ secrets.DELVISO_PASSWORD }}
          DISTRIFERR_USER: ${{ secrets.DISTRIFERR_USER }}
          DISTRIFERR_PASSWORD: ${{ secrets.DISTRIFERR_PASSWORD }}
          PRIMERAALT_USER: ${{ secrets.PRIMERAALT_USER }}
          PRIMERAALT_PASSWORD: ${{ secrets.PRIMERAALT_PASSWORD }}

  # En repos públicos GitHub desactiva los workflows programados tras 60 días sin actividad.
  # Volver a habilitarlo por API cada vez que corre reinicia ese contador (mismo método que usa
  # la acción keepalive-workflow), sin commits ni cambios en el repo.
  mantener-activo:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Mantener el workflow programado activo
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/precios-diarios.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
